name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm audit --prod --audit-level high
      - run: pnpm schema:project:check
      - run: pnpm schema:source:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - name: Run unit tests
        # Bound file/process fixture contention on hosted VMs without relaxing assertions or timeouts.
        run: pnpm test --run --maxWorkers=2 --exclude scripts/dev-vite.test.ts
      - name: Run Vite process integration test
        run: pnpm test --run scripts/dev-vite.test.ts

  browser-security:
    name: Browser security regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm docs:build
