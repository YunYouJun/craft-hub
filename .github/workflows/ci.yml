name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm schema:project:check
      - run: pnpm schema:source:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run unit tests
        run: pnpm test --run --exclude scripts/dev-vite.test.ts
      - name: Run Vite process integration test
        run: pnpm test --run scripts/dev-vite.test.ts

  browser-security:
    name: Browser security regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser

  node-compatibility:
    name: Runtime on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test --run packages/craft-hub/test apps/desktop/test

  native-macos:
    name: Native macOS with Node ${{ matrix.runtime-node }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime-node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:macos
      - run: pnpm build:macos
      # Keep build tools on the pinned workspace Node, then exercise the finished app with each supported runtime.
      - name: Select runtime Node ${{ matrix.runtime-node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime-node }}
      - name: Test Swift with built Node dependencies and packaged cloud runtime
        run: |
          node --print 'JSON.stringify({ version: process.version, arch: process.arch, executable: process.execPath })'
          CRAFT_HUB_TEST_NODE="$(command -v node)" CRAFT_HUB_TEST_CLOUD_SIDECAR="$PWD/apps/macos/build/Craft Hub Prototype.app/Contents/Resources/app/apps/desktop/dist/sidecar.mjs" swift test --package-path apps/macos
      - name: Verify the local app signature
        run: codesign --verify --deep --strict 'apps/macos/build/Craft Hub Prototype.app'
      - name: Verify native plugin management and external host extension lifecycle
        run: |
          node --import tsx apps/macos/scripts/verify-management.ts
          node --import tsx apps/macos/scripts/verify-host-extensions.ts
      - name: Verify profile migration and native instance lifecycle
        run: |
          node --import tsx apps/macos/scripts/verify-profile-migration.ts
          node --import tsx apps/macos/scripts/verify-native-instance.ts
      - name: Reject unverified identity recipients before normal native startup
        run: node --import tsx apps/macos/scripts/verify-identity-recipient.ts
      - name: Verify suspended identity recipient process ownership
        run: node --import tsx scripts/verify-identity-launcher.ts
      - name: Verify Sparkle framework and signed update artifacts
        run: node --import tsx apps/macos/scripts/verify-updates.ts

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
