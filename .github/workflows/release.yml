name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$workspace_version"
          node -e "const fs=require('fs');const root=require('./package.json').version;for(const path of ['apps/cloud/package.json','apps/desktop/package.json','apps/web/package.json','packages/craft-hub-mcp/package.json','packages/craft-hub-personal-cloud/package.json','packages/craft-hub/package.json']){const version=JSON.parse(fs.readFileSync(path)).version;if(version!==root)throw new Error(path+' has '+version+', expected '+root)}"
          if [[ "$tag_version" == *-alpha.* && ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo 'Distributed alpha versions must use a numeric alpha prerelease suffix.' >&2
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm build
      - run: pnpm docs:build

  package-macos:
    name: Package macOS (${{ matrix.arch }})
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/craft-hub-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo 'MACOS_SIGNING_ENABLED=true' >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"

          echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
      - name: Package signed, notarized app, DMG, and update ZIP
        run: pnpm run package:mac
        env:
          MACOS_ARCHES: ${{ matrix.arch }}
      - name: Verify signatures, notarization, and archives
        run: |
          app_path="release/Craft Hub-darwin-${{ matrix.arch }}/Craft Hub.app"
          dmg_path="release/Craft-Hub-macOS-${{ matrix.arch }}.dmg"
          zip_path="release/Craft-Hub-macOS-${{ matrix.arch }}.zip"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          hdiutil verify "$dmg_path"
          unzip -t "$zip_path"
      - name: Run mounted DMG startup smoke test
        run: |
          mount_path="$RUNNER_TEMP/craft-hub-${{ matrix.arch }}"
          mkdir -p "$mount_path"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "release/Craft-Hub-macOS-${{ matrix.arch }}.dmg"
          trap 'hdiutil detach "$mount_path" || true' EXIT
          CRAFT_HUB_SMOKE_TEST=true perl -e 'alarm 45; exec @ARGV' "$mount_path/Craft Hub.app/Contents/MacOS/Craft Hub"
          hdiutil detach "$mount_path"
          trap - EXIT
      - uses: actions/upload-artifact@v7
        with:
          name: craft-hub-macos-${{ matrix.arch }}
          path: |
            release/Craft-Hub-macOS-${{ matrix.arch }}.dmg
            release/Craft-Hub-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${MACOS_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi

  release:
    name: Finalize GitHub Release
    needs: [validate, package-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/download-artifact@v8
        with:
          pattern: craft-hub-macos-*
          path: release
          merge-multiple: true
      - run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload verified macOS artifacts
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/Craft-Hub-macOS-arm64.dmg \
            release/Craft-Hub-macOS-arm64.zip \
            release/Craft-Hub-macOS-x64.dmg \
            release/Craft-Hub-macOS-x64.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish craft-hub to npm
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Verify npm trusted publishing support
        run: |
          node -e "const { execFileSync } = require('node:child_process'); const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); const [major, minor] = version.split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) throw new Error('npm 11.5.1 or newer is required for OIDC trusted publishing; found ' + version)"
      - name: Pack and publish public package
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/craft-hub/package.json').version")"
          package_dir="$RUNNER_TEMP/npm-package"
          tarball="$package_dir/craft-hub-$package_version.tgz"
          mkdir -p "$package_dir"

          pnpm --filter craft-hub pack --pack-destination "$package_dir"
          test -f "$tarball"

          if [[ "$package_version" == *-* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi

          npm publish "$tarball" --access public --tag "$dist_tag"

  deploy-site:
    name: Deploy documentation and update feed
    needs: [release, publish-npm]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
    with:
      release_tag: ${{ github.ref_name }}
