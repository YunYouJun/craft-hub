ignoreWorkspaceRootCheck: true
injectWorkspacePackages: true

syncInjectedDepsAfterScripts:
  - build

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  # Reviewed exact tarball: static theme JSON and literal-only ESM, no scripts/dependencies (docs/guide/dependency-security.md).
  - '@pierre/theme@2.0.0'

shellEmulator: true

packages:
  - apps/*
  - playground
  - docs
  - packages/*
  - examples/*
  - cloudfunctions/*
  - vendor/*

overrides:
  '@azure/msal-node@>=5.0.0-beta.0 <7.1.0': 7.1.1
  '@modelcontextprotocol/client@>=2.0.0 <2.2.0': 2.2.0
  '@modelcontextprotocol/sdk@<1.32.2': 1.32.2
  '@toon-format/toon@<2.3.1': 2.3.1
  axios: ^1.20.0
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  esbuild: ^0.28.1
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  follow-redirects@<1.16.1: 1.16.1
  hono: ^4.13.11
  http-cache-semantics@<=4.2.0: 4.3.0
  ip-address@>=10.0.0 <10.7.4: 10.7.4
  katex@>=0.11.0 <0.18.2: 0.18.2
  lodash.set: link:vendor/lodash-set-safe
  lodash.unset: 4.18.0
  markdown-it@>=14.0.0 <14.3.3: 14.3.3
  nanoid: ^3.3.18
  postcss-selector-parser@>=7.0.0 <7.1.6: 7.1.6
  proxy-addr@>=1.1.0 <2.0.8: 2.0.8
  qs: ^6.16.0
  sharp: 0.35.5
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  undici@>=6.7.0 <6.29.1: 6.29.1
  undici@>=7.0.0 <7.30.1: 7.30.1
  undici@>=8.0.0 <8.12.2: 8.12.2
  vite@>=8.3.0 <=8.3.2: 8.3.5
  zod@<4.6.6: 4.6.7

# The vanilla diffs API does not use its React adapter.
packageExtensions:
  '@pierre/diffs@1.6.1':
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true

patchedDependencies:
  '@softeria/ms-365-mcp-server@0.171.0': patches/@softeria__ms-365-mcp-server@0.171.0.patch
  node-pty@1.1.0: patches/node-pty@1.1.0.patch

allowBuilds:
  core-js-pure: true
  electron: true
  esbuild: true
  keytar: true
  node-pty: true
  simple-git-hooks: true
  vue-demi: true
  workerd: true

