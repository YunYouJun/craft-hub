ignoreWorkspaceRootCheck: true
injectWorkspacePackages: true

minimumReleaseAge: 1440
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
allowBuilds:
  core-js-pure: true
  electron: true
  esbuild: true
  node-pty: true
  simple-git-hooks: true
  vue-demi: true
  workerd: true

packages:
  - apps/*
  - playground
  - docs
  - packages/*
  - examples/*
  - cloudfunctions/*
  - vendor/*
overrides:
  axios: ^1.20.0
  esbuild: ^0.28.1
  lodash.set: link:vendor/lodash-set-safe
  lodash.unset: 4.18.0
  nanoid: ^3.3.18
patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
