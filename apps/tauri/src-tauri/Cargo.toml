[package]
name = "craft-hub-tauri-trial"
version = "0.0.1-alpha.5"
description = "Optional Craft Hub Tauri host experiment"
authors = [ "Craft Hub contributors" ]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
